[package]
name = "talktype"
version = "0.0.1"
description = "TalkType — cross-platform desktop voice input tool"
authors = ["luluboy168"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "talktype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
cpal = "0.15"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
rustfft = "6"
# `rt` for `tokio::task::spawn_blocking` (audio_recorder/commands.rs encode_wav).
# `time` for `tokio::time::sleep` (transcription/cloud.rs retry honoring
# Retry-After). Tauri pulls tokio transitively but only with its own features,
# so we promote it to a direct dep here. Tauri's command runtime is itself
# tokio-based so this stays ABI-compatible.
tokio = { version = "1", features = ["rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }

# `keyring` v3 is the cross-platform OS credential vault. We pin per-target
# features so each desktop OS uses its native backend (Windows Credential
# Manager, macOS Keychain, Linux secret-service) without dragging the others
# in. Phase 1 is Windows-only — macOS / Linux blocks are pre-wired here so
# Phase 2 cross-platform polish doesn't need to revisit the dep graph.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
# `tempfile` powers the M3 chunk-0 filesystem integration tests in
# `plugins/audio_recorder/files.rs`. Stays out of the release build via
# the `dev-dependencies` table.
tempfile = "3"
# `wiremock` is reserved for M3 chunk-2 transcription tests (mock Groq
# `/audio/transcriptions` responses for the 8 error variants and one happy
# path). Added in chunk-1 to avoid re-running cargo add later.
wiremock = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
